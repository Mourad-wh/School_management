<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2&family=Fredoka+One&display=swap" rel="stylesheet">
    <title>Abscence</title>
    <style>
        body {
            background-color: #f9faff;
            font-family: 'Baloo 2', cursive;
        }
        .authentification {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            overflow: hidden;
        }

        .formsection {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 50px;
            z-index: 1;
            background-color: #f9faff; /* semi-transparent white */
        }

        .formsection h1 {
            margin-bottom: 20px;
            font: bold;
        }

        .formsection form {
            display: flex;
            flex-direction: column;
        }

        .formsection label {
            margin-top: 10px;
            margin-bottom: 5px;
        }

        .formsection input,
        .formsection button {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        .formsection button {
            background-color: #007bff;
            color: white;
            cursor: pointer;
            border: none;
        }

        #bg-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="logo">Educa</div>
        <ul>
          <li><a href="#">Classes</a></li>
          <li><a href="#">Teachers</a></li>
          <li><a href="#">Abscence</a></li>
          <li><a href="#">Exams</a></li>
          <li><a href="#">Timetables</a></li>
        </ul>
    </nav>
    
</body>
