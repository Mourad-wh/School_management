<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2&family=Fredoka+One&display=swap" rel="stylesheet">
    <title>Welcome</title>
    <style>
        body {
          background-color: #f9faff;
          font-family: 'Baloo 2', cursive;
          margin: 0;
          padding: 0;
        }
    
        .navbar {
          background-color: #9fc3f8;
          display: flex;
          justify-content: space-between;
          align-items: center;
          padding: 1rem 2rem;
          border-bottom: 4px solid #6c5ce7;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }
    
        .navbar .logo {
          font-family: 'Fredoka One', cursive;
          font-size: 1.8rem;
          color: white;
        }
    
        .navbar ul {
          list-style: none;
          display: flex;
          gap: 1.5rem;
          margin: 0;
          padding: 0;
        }
    
        .navbar li a {
          text-decoration: none;
          color: rgb(74, 74, 74);
          font-weight: bold;
          transition: color 0.3s;
        }
    
        .navbar li a:hover {
          color: #ffd6e8;
        }

        .dashboard {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 100vh;
            overflow: hidden;
        }

        #bg-video {
            width: 50%;
            height: 50%;
            object-fit: cover;
            border: 4px solid #6c5ce7;
            border-top: none;
            border-radius: 10px;
        }
      </style>
</head>
<body>
    
    <nav class="navbar">
        <div class="logo">Educa</div>
        <ul>
            <li><a href="#">Classes</a></li>
            <li><a href="#">Teachers</a></li>
            <li><a href="#">Abscence</a></li>
            <li><a href="#">Exams</a></li>
            <li><a href="#">Timetables</a></li>
        </ul>
    </nav>

    <div class="dashboard">
        <video autoplay loop muted playsinline id="bg-video">
            <source src="../images/WEB.mp4" type="video/mp4">
        </video>

    </div>


</body>
